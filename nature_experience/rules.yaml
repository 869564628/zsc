version: "1.1.0"

export:
  formats: ["png", "svg", "pdf"]
  transparent_background: true

typography:
  family: "Arial"
  base_size_pt: 12
  italicize:
    - gene_symbols
    - latin_species_names
  do_not_automatically_italicize:
    - protein_names

axes:
  gridlines: false
  spine_width_pt: 1.5
  optional_stronger_spine_width_pt: 2.0
  equal_spine_width: true
  max_major_ticks: 6

statistics:
  significance_style: "asterisks"
  thresholds:
    "*": 0.05
    "**": 0.01
    "***": 0.001
    "****": 0.0001
  note: "State the convention in the figure caption; use exact P values when more informative or required."

color_policy:
  same_group_same_color: true
  manuscript_palette_is_global: true
  do_not_reassign_existing_group_colors: true
  population_palette:
    KM: "#C4A3F6"
    MY: "#88D1E6"
    WH: "#DB9971"
    HF: "#66C2A5"
    WX: "#FFCD8A"
    PDS: "#E79FB3"
    QD: "#ADCF60"
    TJ: "#6FA8FF"

privacy:
  anonymize_sample_names_when_requested: true
  anonymize_group_labels_when_requested: true
  never_publish_private_mapping: true

design:
  avoid_gridlines: true
  avoid_decorative_effects: true
  consistent_panel_alignment: true
  consistent_visual_encoding: true
  prefer_reproducible_scripts: true
