name: Package experience skill

on:
  push:
    branches: [main]
    paths:
      - "nature_experience/**"
      - ".github/workflows/package-experience.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Package portable skill folder
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < nature_experience/VERSION)"
          mkdir -p dist/experience
          cp -R nature_experience/. dist/experience/
          cd dist
          zip -r "experience-${VERSION}.zip" experience
          echo "PACKAGE=dist/experience-${VERSION}.zip" >> "$GITHUB_ENV"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Upload downloadable skill package
        uses: actions/upload-artifact@v4
        with:
          name: experience-${{ env.VERSION }}
          path: ${{ env.PACKAGE }}
          if-no-files-found: error
          retention-days: 90
