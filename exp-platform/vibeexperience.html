<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VibeExperience · 灵感经验站</title>
<meta name="description" content="按学科分类的轻量学习灵感墙：一句话心得、顿悟时刻、学习妙招与心态加油站。">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='16'%20fill='%23E2623C'/%3E%3Ctext%20x='32'%20y='45'%20font-size='38'%20text-anchor='middle'%20fill='%23FFF7EC'%20font-family='sans-serif'%20font-weight='800'%3E%E7%81%B5%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<style>
:root{
  --board:#F3EAD9; --board2:#EAE0CB; --card:#FFFDF7; --ink:#2A2620; --ink2:#6E675A;
  --line:#E0D6C0; --line2:#D2C6AC; --coral:#E2623C; --sun:#E8A33D; --teal:#2F7E6D; --blue:#3D5A80;
  --c1:#FFEFB8; --c2:#D7E6F4; --c3:#DCECCE; --c4:#FFD8CB; --c5:#F4DFC9; --c6:#E8DCF2;
  --serif:'Noto Serif SC','Songti SC','SimSun',serif;
  --sans:'Noto Sans SC','Microsoft YaHei',sans-serif;
  --shadow:0 2px 6px rgba(42,38,32,.08), 0 8px 20px rgba(42,38,32,.07);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--board);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.7}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
::selection{background:#F6D9C8}
:focus-visible{outline:2px solid var(--coral);outline-offset:2px}
.hidden{display:none!important}

/* ===== 顶栏 ===== */
#topbar{position:sticky;top:0;z-index:50;background:rgba(243,234,217,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.mark{width:34px;height:34px;border-radius:11px;background:var(--coral);color:#FFF7EC;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;flex:none;box-shadow:inset 0 -2px 0 rgba(0,0,0,.15)}
.brand-name{font-family:var(--serif);font-weight:700;font-size:17px;letter-spacing:.5px}
.brand-sub{font-size:11px;color:var(--ink2);letter-spacing:2px;margin-top:-2px}
.nav{display:flex;gap:4px;margin-left:8px}
.nav a{padding:7px 13px;border-radius:20px;color:var(--ink2);font-size:14px;text-decoration:none;font-weight:500}
.nav a:hover{background:var(--board2);color:var(--ink)}
.nav a.on{color:var(--coral);background:rgba(226,98,60,.1);font-weight:700}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.top-search{position:relative}
.top-search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);stroke:var(--ink2)}
.top-search input{width:200px;padding:8px 12px 8px 32px;border:1px solid var(--line);border-radius:20px;background:var(--card);outline:none}
.top-search input:focus{border-color:var(--coral)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--card);color:var(--ink);padding:8px 16px;border-radius:20px;font-size:14px;font-weight:600;transition:all .15s}
.btn:hover{border-color:var(--coral);color:var(--coral)}
.btn.primary{background:var(--coral);border-color:var(--coral);color:#FFF7EC}
.btn.primary:hover{background:#D35330;color:#FFF7EC}
.btn.danger{background:transparent;border-color:#E3A99B;color:var(--coral)}
.btn.danger:hover{background:rgba(226,98,60,.06);border-color:var(--coral)}
.btn.small{padding:5px 11px;font-size:13px;border-radius:14px}
.btn svg{flex:none}
.lang-btn{background:transparent;border:1px solid var(--line2);color:var(--ink2);font-size:12.5px;font-weight:600;padding:7px 12px;border-radius:20px;transition:all .15s}
.lang-btn:hover{border-color:var(--teal);color:var(--teal)}
.link-plain{color:var(--ink2);font-size:13px;padding:7px 11px;border-radius:20px;text-decoration:none;border:1px dashed var(--line2)}
.link-plain:hover{color:var(--teal);border-color:var(--teal);text-decoration:none}

/* ===== Hero ===== */
.hero{max-width:1240px;margin:0 auto;padding:48px 20px 26px;text-align:center}
.hero .eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:13px;letter-spacing:3px;color:var(--coral);border:1px solid rgba(226,98,60,.35);border-radius:20px;padding:5px 16px;background:rgba(226,98,60,.06)}
.hero h1{font-family:var(--serif);font-weight:900;font-size:clamp(28px,4.6vw,44px);line-height:1.28;margin:16px 0 8px}
.hero h1 em{font-style:normal;color:var(--coral)}
.hero p{color:var(--ink2);font-size:15.5px;max-width:560px;margin:0 auto}
.hero .big-search{max-width:620px;margin:22px auto 0;position:relative}
.hero .big-search input{width:100%;padding:14px 20px 14px 46px;border:1px solid var(--line2);border-radius:26px;background:var(--card);font-size:16px;outline:none;box-shadow:var(--shadow)}
.hero .big-search input:focus{border-color:var(--coral)}
.hero .big-search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);stroke:var(--ink2)}
.hero .stats{display:flex;justify-content:center;gap:34px;margin-top:24px}
.stat{display:flex;flex-direction:column;align-items:center}
.stat b{font-family:var(--serif);font-size:26px;color:var(--ink)}
.stat span{font-size:12px;color:var(--ink2);letter-spacing:1px}

/* ===== 主区 ===== */
#app{max-width:1240px;margin:0 auto;padding:4px 20px 60px}
.layout{display:grid;grid-template-columns:230px 1fr;gap:22px;align-items:start}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}

/* 学科树（同构，圆角风格） */
.tree{position:sticky;top:76px;max-height:calc(100vh - 100px);overflow:auto;padding:14px 10px}
.tree-head{display:flex;align-items:center;justify-content:space-between;padding:2px 8px 10px;font-family:var(--serif);font-weight:700;font-size:15px;border-bottom:1px solid var(--line);margin-bottom:8px}
.tree-head button{font-size:12px;color:var(--teal);background:none;border:none;padding:2px 6px}
.tree input{width:100%;padding:6px 10px;border:1px solid var(--line);border-radius:10px;background:var(--board);font-size:13px;margin-bottom:8px;outline:none}
.tree ul{list-style:none}
.tree ul ul{margin-left:14px;border-left:1px solid var(--line2);padding-left:8px}
.t-node{display:flex;align-items:center;gap:5px;width:100%;text-align:left;background:none;border:none;padding:5px 7px;border-radius:8px;font-size:13.5px;color:var(--ink2)}
.t-node:hover{background:var(--board2);color:var(--ink)}
.t-node.on{background:rgba(47,126,109,.1);color:var(--teal);font-weight:600}
.t-node .caret{width:14px;height:14px;flex:none;display:inline-flex;align-items:center;justify-content:center;transition:transform .15s}
.t-node.closed .caret{transform:rotate(-90deg)}
.t-node .cnt{margin-left:auto;font-size:11px;color:var(--ink2);background:var(--board2);border-radius:8px;padding:0 7px}
.t-node.on .cnt{background:var(--teal);color:#fff}
.t-node.muted{color:#B0A892}

/* 列表头 */
.list-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--line)}
.crumb{display:flex;align-items:center;gap:6px;font-family:var(--serif);font-size:15px;font-weight:700;flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.crumb .dot{color:var(--coral);font-size:12px}
.crumb .seal-tag{font-family:var(--sans);font-size:11px;background:var(--coral);color:#FFF7EC;border-radius:9px;padding:2px 9px;letter-spacing:1px}
.sort-group{display:flex;gap:4px;background:var(--board2);border-radius:20px;padding:3px}
.sort-group button{border:none;background:transparent;padding:5px 12px;border-radius:16px;font-size:13px;color:var(--ink2)}
.sort-group button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(42,38,32,.12)}
.tag-filter{display:flex;gap:6px;flex-wrap:wrap;padding:0 18px 12px}
.chip{border:1px solid var(--line2);background:var(--board);border-radius:16px;padding:3px 12px;font-size:12.5px;color:var(--ink2);cursor:pointer}
.chip.on{background:var(--coral);border-color:var(--coral);color:#fff}

/* 便签墙 */
.board{columns:300px 4;column-gap:18px;padding:18px}
.note{break-inside:avoid;margin:0 0 20px;border-radius:6px;padding:20px 16px 12px;position:relative;box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s;display:flex;flex-direction:column;gap:8px}
.note:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(42,38,32,.16)}
.note::before{content:"";position:absolute;top:-9px;left:50%;transform:translateX(-50%) rotate(-2deg);width:88px;height:20px;background:rgba(255,255,255,.72);border:1px solid rgba(0,0,0,.05);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.note .nt{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink2)}
.note .nt .type-tag{font-weight:700;letter-spacing:1px}
.note h3{font-family:var(--serif);font-size:16.5px;line-height:1.5;font-weight:700}
.note h3 a{color:var(--ink)}
.note h3 a:hover{color:var(--coral)}
.note .n-body{font-size:14px;color:#3D372D;white-space:pre-wrap;word-break:break-word}
.note .n-body.trunc{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.note .tags{display:flex;flex-wrap:wrap;gap:5px}
.note .tags span{font-size:11.5px;background:rgba(255,255,255,.6);color:var(--ink2);border-radius:4px;padding:1px 7px}
.note .foot{display:flex;align-items:center;gap:10px;border-top:1px dashed rgba(42,38,32,.15);padding-top:9px;font-size:12px;color:var(--ink2)}
.note .foot .sp{flex:1}
.note .foot .like.on{color:var(--coral)}
.note .foot .badge{font-size:11px;border:1px solid #E3A99B;color:var(--coral);border-radius:9px;padding:0 7px}
.note .foot .badge.sample{color:#9C7C2E;border-color:#D9C07C}
.empty{padding:70px 20px;text-align:center;color:var(--ink2)}
.empty b{display:block;font-family:var(--serif);font-size:20px;color:var(--ink);margin-bottom:6px}
.loadmore{display:block;margin:6px auto 26px;padding:9px 30px}

/* ===== 便签详情 ===== */
.detail{max-width:760px;margin:0 auto}
.detail .topline{display:flex;align-items:center;gap:10px;margin-bottom:16px;font-size:13px;color:var(--ink2)}
.detail .topline .back{border:1px solid var(--line2);border-radius:20px;padding:6px 14px;color:var(--ink2);font-size:13px;background:var(--card);text-decoration:none}
.detail .topline .back:hover{color:var(--coral);border-color:var(--coral);text-decoration:none}
.note-lg{border-radius:10px;padding:34px 34px 22px;box-shadow:var(--shadow)}
.note-lg .nt{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink2);margin-bottom:12px}
.note-lg h1{font-family:var(--serif);font-size:26px;line-height:1.45;font-weight:900;margin:6px 0 12px}
.note-lg .n-body{font-size:16px;line-height:2;color:#3D372D;white-space:pre-wrap;word-break:break-word;border-top:1px dashed rgba(42,38,32,.15);border-bottom:1px dashed rgba(42,38,32,.15);padding:14px 0}
.note-lg .extra{margin-top:14px;font-size:13.5px;color:var(--ink2)}
.note-lg .extra b{color:var(--ink)}
.note-lg .meta{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--ink2);margin-top:16px;padding-top:14px;border-top:1px dashed rgba(42,38,32,.15)}
.note-lg .meta b{color:var(--ink)}
.note-lg .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}
.note-lg .tags span{font-size:12px;background:rgba(255,255,255,.6);border-radius:4px;padding:1px 8px}
.actions{display:flex;gap:10px;margin:16px 0 28px;flex-wrap:wrap}
.actions .btn.like.on{background:rgba(226,98,60,.08);border-color:var(--coral);color:var(--coral)}
.comments{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 26px;box-shadow:var(--shadow)}
.comments h3{font-family:var(--serif);font-size:18px;margin-bottom:14px}
.cmt-form{display:flex;gap:10px;margin-bottom:16px}
.cmt-form input[type=text]{flex:0 0 130px;padding:9px 12px;border:1px solid var(--line);border-radius:14px;background:var(--board)}
.cmt-form textarea{flex:1;padding:9px 12px;border:1px solid var(--line);border-radius:14px;background:var(--board);resize:vertical;min-height:42px}
.cmt{display:flex;gap:10px;padding:12px 0;border-bottom:1px dashed var(--line2);font-size:14px}
.cmt .av{width:30px;height:30px;border-radius:50%;background:var(--coral);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;flex:none}
.cmt .cm{border:1px solid var(--line);background:var(--board);border-radius:12px;padding:8px 12px;flex:1}
.cmt .cm .who{font-size:12px;color:var(--ink2);margin-bottom:2px}
.cmt .cm .who b{color:var(--ink)}

/* ===== 表单 ===== */
.form-wrap{max-width:700px;margin:0 auto}
.form-wrap h1{font-family:var(--serif);font-size:26px;font-weight:900;margin-bottom:4px}
.form-wrap .lead{color:var(--ink2);font-size:14px;margin-bottom:22px}
.form-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px 32px;box-shadow:var(--shadow)}
.f-group{margin-bottom:20px}
.f-group label{display:block;font-weight:600;font-size:14px;margin-bottom:7px}
.f-group label .req{color:var(--coral)}
.f-group .hint{font-size:12px;color:var(--ink2);margin-top:4px}
.f-group input[type=text],.f-group input[type=url],.f-group textarea,.f-group select{width:100%;padding:10px 13px;border:1px solid var(--line);border-radius:12px;background:var(--board);outline:none;transition:border-color .15s}
.f-group input:focus,.f-group textarea:focus,.f-group select:focus{border-color:var(--coral)}
.f-group textarea{resize:vertical;min-height:110px;line-height:1.7}
.f-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.path-pick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.path-pick select{padding:9px 8px;border:1px solid var(--line);border-radius:10px;background:var(--board);font-size:13px;min-width:0;outline:none}
.path-pick select:focus{border-color:var(--coral)}
.addsub{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--teal);background:none;border:1px dashed var(--teal);border-radius:8px;padding:3px 9px;margin-top:6px}
.type-pick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.type-card{border:1.5px solid var(--line2);background:var(--board);border-radius:12px;padding:12px 14px;text-align:left;transition:all .15s}
.type-card b{font-size:14px;display:block}
.type-card span{font-size:12px;color:var(--ink2)}
.type-card.on{border-color:var(--ink);background:var(--card);box-shadow:var(--shadow)}
.type-swatch{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px}
.form-actions{display:flex;gap:12px;margin-top:24px;padding-top:18px;border-top:1px dashed var(--line2)}

/* ===== 设置 ===== */
.set-wrap{max-width:760px;margin:0 auto}
.set-wrap h1{font-family:var(--serif);font-size:26px;font-weight:900;margin-bottom:20px}
.set-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px 30px;margin-bottom:18px;box-shadow:var(--shadow)}
.set-card h2{font-family:var(--serif);font-size:18px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.set-card h2::before{content:"";width:14px;height:3px;background:var(--coral);border-radius:2px}
.set-row{display:grid;grid-template-columns:140px 1fr;gap:10px;align-items:center;margin-bottom:12px}
.set-row label{font-size:13.5px;color:var(--ink2);font-weight:600}
.set-row input{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--board);outline:none}
.set-row input:focus{border-color:var(--coral)}
.set-btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.gh-status{font-size:12.5px;color:var(--ink2);background:var(--board);border:1px solid var(--line);border-radius:10px;padding:9px 13px;margin-top:12px;white-space:pre-wrap;max-height:140px;overflow:auto;font-family:ui-monospace,Consolas,monospace}
.ol{margin:8px 0 8px 20px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.ol code{background:var(--board2);border:1px solid var(--line);border-radius:5px;padding:1px 7px;font-size:12.5px;word-break:break-all}
.note{font-size:12.5px;color:var(--ink2);border-left:3px solid #D9C07C;background:rgba(217,192,124,.1);padding:9px 13px;border-radius:0 8px 8px 0;margin-top:12px}

/* ===== Toast & Modal ===== */
#toast-wrap{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--ink);color:var(--card);padding:10px 20px;border-radius:16px;font-size:13.5px;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:tin .2s ease}
.toast.err{background:var(--coral)}
.toast.ok{background:var(--teal)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#modal-root{position:fixed;inset:0;z-index:150;display:none}
#modal-root.show{display:flex;align-items:center;justify-content:center;background:rgba(42,38,32,.45);padding:20px}
.modal{background:var(--card);border-radius:18px;max-width:440px;width:100%;padding:26px 28px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal h3{font-family:var(--serif);font-size:18px;margin-bottom:10px}
.modal p{font-size:14px;color:var(--ink2);margin-bottom:18px;white-space:pre-wrap}
.modal .mb{display:flex;justify-content:flex-end;gap:10px}

footer{border-top:1px solid var(--line);padding:26px 20px;text-align:center;color:var(--ink2);font-size:12.5px}
footer a{color:var(--teal)}

@media (max-width:980px){
  .layout{grid-template-columns:1fr}
  .tree{position:static;max-height:300px}
  .nav{display:none}
  .top-search input{width:130px}
  .board{columns:280px 2}
}
@media (max-width:640px){
  .top-in{padding:10px 14px}
  .brand-sub{display:none}
  .hero{padding:34px 16px 18px}
  .hero .stats{gap:20px}
  .board{columns:1}
  .form-card{padding:22px 18px}
  .f-row{grid-template-columns:1fr}
  .path-pick{grid-template-columns:1fr 1fr}
  .type-pick{grid-template-columns:1fr 1fr}
  .note-lg{padding:24px 18px}
  .set-row{grid-template-columns:1fr;gap:4px}
  .cmt-form{flex-direction:column}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header id="topbar">
  <div class="top-in">
    <a class="brand" href="#/" title="VibeExperience 灵感经验站">
      <span class="mark">灵</span>
      <span>
        <div class="brand-name">VibeExperience</div>
        <div class="brand-sub" data-i18n="灵感经验站">灵感经验站</div>
      </span>
    </a>
    <nav class="nav" id="nav">
      <a href="#/" data-nav="home" data-i18n="灵感墙">灵感墙</a>
      <a href="#/contrib" data-nav="contrib" data-i18n="投稿经验">投稿经验</a>
      <a href="#/submit" data-nav="submit" data-i18n="贴一条">贴一条</a>
      <a href="#/mine" data-nav="mine" data-i18n="我的">我的</a>
      <a href="#/settings" data-nav="settings" data-i18n="设置">设置</a>
    </nav>
    <div class="top-right">
      <div class="top-search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="top-q" type="search" placeholder="搜索灵感、标签…" aria-label="搜索" data-i18n-ph="搜索灵感、标签…">

/* ============ 学科工具 ============ */
function getNode(node, pathArr) {
  let n = node;
  for (const p of pathArr) { if (n && typeof n === "object" && p in n) n = n[p]; else return null; }
  return n;
}
function addNodeToTax(pathArr) {
  let n = db.tax;
  for (const p of pathArr) { if (!(p in n)) n[p] = {}; n = n[p]; }
}
function removeNodeFromTax(pathArr) {
  if (pathArr.length < 1) return false;
  const parent = getNode(db.tax, pathArr.slice(0, -1));
  const last = pathArr[pathArr.length - 1];
  if (parent && typeof parent === "object" && last in parent) { delete parent[last]; return true; }
  return false;
}
function collectAllPaths(node, prefix, out) {
  if (!node || typeof node !== "object") return;
  for (const k of Object.keys(node)) {
    const p = prefix.concat(k);
    out.push(p);
    if (node[k] && typeof node[k] === "object") collectAllPaths(node[k], p, out);
  }
}
function pathStartsWith(p, q) { return p.length >= q.length && q.every((v, i) => p[i] === v); }
function expMatchesPath(exp, q) { if (!q || q.length === 0) return true; return pathStartsWith(exp.path, q); }
function countUnder(nodePath) { return db.experiences.filter(e => expMatchesPath(e, nodePath)).length; }

function filterExps(filter) {
  const q = (filter.q || "").trim().toLowerCase();
  let list = db.experiences.filter(e => e.kind === "vibe");
  if (filter.path && filter.path.length) list = list.filter(e => expMatchesPath(e, filter.path));
  if (filter.tag) list = list.filter(e => (e.tags || []).includes(filter.tag));
  if (filter.type) list = list.filter(e => e.type === filter.type);
  if (q) list = list.filter(e => [e.title, e.content, (e.tags||[]).join(" "), e.author, e.scene].join(" ").toLowerCase().includes(q));
  const sort = filter.sort || "new";
  list = [...list].sort((a, b) => {
    if (sort === "hot") return (b.views||0) - (a.views||0);
    if (sort === "like") return (b.likes||0) - (a.likes||0);
    return (b.createdAt||0) - (a.createdAt||0);
  });
  return list;
}
function allTags() {

  db.experiences.forEach(e => (e.tags||[]).forEach(t => { m[t] = (m[t]||0)+1; }));

}

/* ============ GitHub 同步 ============ */
function b64Encode(str){ return btoa(unescape(encodeURIComponent(str))); }
function b64Decode(str){ return decodeURIComponent(escape(atob(str.replace(/\s/g,"")))); }
async function ghGetFile(owner, repo, path, token, branch) {
  const headers = { "Accept": "application/vnd.github+json" };
  if (token) headers["Authorization"] = "token " + token;
  const url = `https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/contents/${path.split("/").map(encodeURIComponent).join("/")}${token && branch ? "?ref="+encodeURIComponent(branch) : ""}`;
  const r = await fetch(url, { headers });
  if (r.status === 404) return null;
  if (!r.ok) throw new Error("GitHub 读取失败（HTTP " + r.status + "），请检查仓库名/分支/Token 权限");
  return await r.json();
}
async function ghPush(owner, repo, path, content, token, branch) {
  if (!token) throw new Error("未配置 Token，无法推送");
  const existing = await ghGetFile(owner, repo, path, token, branch);
  const body = { message: "update experience data", content: b64Encode(content), branch: branch || "main" };
  if (existing && existing.sha) body.sha = existing.sha;
  const url = `https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/contents/${path.split("/").map(encodeURIComponent).join("/")}`;
  const r = await fetch(url, { method: "PUT", headers: { "Authorization": "token " + token, "Accept": "application/vnd.github+json", "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (!r.ok) { const t = await r.text(); throw new Error("GitHub 推送失败（HTTP " + r.status + "）" + (t.length > 160 ? t.slice(0, 160) : t)); }
  return true;
}
async function ghPull(owner, repo, path, token, branch) {
  let jsonText = null;
  if (token) {
    const f = await ghGetFile(owner, repo, path, token, branch);
    if (f && f.content) jsonText = b64Decode(f.content);
  } else {
    const url = `https://raw.githubusercontent.com/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/${encodeURIComponent(branch||"main")}/${path.split("/").map(encodeURIComponent).join("/")}`;
    const r = await fetch(url);
    if (r.ok) jsonText = await r.text();
  }
  if (!jsonText) throw new Error("云端没有数据文件或无法访问");
  const data = JSON.parse(jsonText);
  if (!data || !Array.isArray(data.experiences)) throw new Error("云端数据格式不正确");
  return data;
}

function downloadFile(name, content, mime) {
  const blob = new Blob([content], { type: mime || "application/json;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 300);
}

}

function computeTreeSearch(q) {

function renderTreeLevel(node, pathArr, q, matchKeys, ancKeys) {
  const k = pathArr[pathArr.length - 1];
  const child = node[k];
  const key = pathArr.join("/");
  const hasChild = child && typeof child === "object" && Object.keys(child).length > 0;
  if (q && !matchKeys.has(key) && !ancKeys.has(key)) return "";
  const open = q ? (matchKeys.has(key) || ancKeys.has(key)) : state.openNodes.has(key);
  const cnt = countUnder(pathArr);
  const on = pathStr(state.filter.path) === key ? "on" : "";
  const rows = hasChild ? Object.keys(child).map(c => renderTreeLevel(child, pathArr.concat(c), q, matchKeys, ancKeys)).join("") : "";
  return `<li>
    <button class="t-node ${on}" data-action="pick-path" data-path="${esc(key)}">
      ${hasChild ? `<span class="caret" data-action="toggle-node" data-path="${esc(key)}">${open ? "▾" : "▸"}</span>` : "<span class='caret' style='pointer-events:none'></span>"}
      <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(dkey(pathArr))}</span>
      <span class="cnt">${cnt}</span>
    </button>
    ${hasChild && open ? `<ul>${rows}</ul>` : ""}
  </li>`;
}
function typeChips() {
  return `<button class="chip ${!state.filter.type ? "on" : ""}" data-action="set-type" data-type="">${tr("全部类型")}</button>` +
    Object.keys(VIBE_TYPES).map(t => `<button class="chip ${state.filter.type === t ? "on" : ""}" data-action="set-type" data-type="${t}">${tr(VIBE_TYPES[t].n)}</button>`).join("");

function localizeStatic() {
  $$("[data-i18n]").forEach(el => { el.textContent = tr(el.dataset.i18n); });
  $$("[data-i18n-ph]").forEach(el => { el.placeholder = tr(el.dataset.i18nPh); });
  const lb = $("#lang-btn");
  if (lb) lb.textContent = lang === "en" ? "中文" : "English";
}
function route() {
  const h = location.hash.slice(1) || "/";
  let r = "home";
  if (h.startsWith("/detail/")) { renderDetail(decodeURIComponent(h.slice(8))); r = "detail"; }
  else if (h === "/submit") { renderSubmit(); r = "submit"; }
  else if (h.startsWith("/edit/")) { renderSubmit(decodeURIComponent(h.slice(6))); r = "submit"; }
  else if (h === "/contrib") { renderContrib(); r = "contrib"; }
  else if (h === "/mine") { renderMine(); r = "mine"; }
  else if (h === "/settings") { renderSettings(); r = "settings"; }
  else renderHome();
  state.route = r;
  const navMap = { home: "#/", contrib: "#/contrib", submit: "#/submit", mine: "#/mine", settings: "#/settings" };
  $$("#nav a").forEach(a => a.classList.toggle("on", a.getAttribute("href") === navMap[r]));
  document.title = (r === "detail") ? document.title : (lang === "en" ? "VibeExperience · Idea Wall" : "VibeExperience · 灵感经验站");
  localizeStatic();
  window.scrollTo(0, 0);
}

/* ============ 全局事件 ============ */
function setGhStatus(t) { const el = $("#gh-status"); if (el) el.textContent = t; }
function updateLikes(id) {
  const e = db.experiences.find(x => x.id === id);
  if (!e) return;
  const on = state.liked.has(id);
  $$(`[data-action="like"][data-id="${id}"]`).forEach(b => {
    b.classList.toggle("on", on);
    b.innerHTML = IC.like + " " + (e.likes || 0);
  });
}
async function onClick(e) {
  const t = e.target.closest("[data-action]");
  if (!t) return;
  const act = t.dataset.action;
  const id = t.dataset.id;
  switch (act) {
    case "pick-path": {
      const p = t.dataset.path ? t.dataset.path.split("/") : [];
      state.filter.path = p; state.filter.tag = ""; state.page = 1;
      const tree = $("#tree");
      if (tree) { tree.innerHTML = renderTree(); bindTreeQ(); }
      renderListPanel();
      break;
    }
    case "toggle-node": {
      const key = t.dataset.path;
      if (state.openNodes.has(key)) state.openNodes.delete(key); else state.openNodes.add(key);
      const tree = $("#tree");
      if (tree) { tree.innerHTML = renderTree(); bindTreeQ(); }
      break;
    }
    case "expand-all": {
      const all = []; collectAllPaths(db.tax, [], all);
      all.forEach(p => state.openNodes.add(p.join("/")));
      const tree = $("#tree");
      if (tree) { tree.innerHTML = renderTree(); bindTreeQ(); }
      break;
    }
    case "set-sort": state.filter.sort = t.dataset.sort; renderListPanel(); break;
    case "set-type": state.filter.type = state.filter.type === t.dataset.type ? "" : t.dataset.type; renderListPanel(); break;
    case "set-tag": state.filter.tag = state.filter.tag === t.dataset.tag ? "" : t.dataset.tag; renderListPanel(); break;
    case "clear-q": state.filter.q = ""; state.page = 1; const hq = $("#hero-q"); if (hq) hq.value = ""; renderListPanel(); break;
    case "load-more": state.page++; renderListPanel(); break;
    case "go-submit": location.hash = "#/submit"; break;
    case "like": {
      const ex = db.experiences.find(x => x.id === id);
      if (!ex) break;
      if (state.liked.has(id)) { state.liked.delete(id); ex.likes = Math.max(0, (ex.likes || 0) - 1); }
      else { state.liked.add(id); ex.likes = (ex.likes || 0) + 1; }
      saveDB(); updateLikes(id);
      break;
    }
    case "edit": location.hash = "#/edit/" + encodeURIComponent(id); break;
    case "del": {
      const ex = db.experiences.find(x => x.id === id);
      if (!ex) break;
      if (await askConfirm(trf("确定删除《{0}》？删除后不可恢复。", ex.title), tr("删除"), true)) {
        db.experiences = db.experiences.filter(x => x.id !== id);
        saveDB(); toast(tr("已删除"), "ok");
        if (state.route === "detail") location.hash = "#/"; else route();
      }
      break;
    }
    case "share": {
      const ex = db.experiences.find(x => x.id === id);
      if (!ex) break;
      const tp = VIBE_TYPES[ex.type] || VIBE_TYPES.spark;
      const txt = `${lang === "en" ? "[" + tx(ex, "title") + "]" : "【" + ex.title + "】"}\n${tr("类型：")}${tr(tp.n)} · ${tr("学科：")}${pstr(ex.path)}\n${tx(ex, "content")}\n— ${tr("来自 VibeExperience 灵感经验站")}`;
      const okc = await copyText(txt);
      toast(okc ? tr("分享文本已复制") : tr("复制失败，请长按手动复制"), okc ? "ok" : "err");
      break;
    }
    case "copy-link": {
      const okc = await copyText(location.href);
      toast(okc ? tr("页面链接已复制（发布后可发给他人直接打开）") : tr("复制失败"), okc ? "ok" : "err");
      break;
    }
    case "comment-submit": {
      const author = ($("#cmt-author").value || "").trim() || tr("匿名");
      const content = ($("#cmt-content").value || "").trim();
      if (!content) { toast(tr("回复内容不能为空"), "err"); break; }
      const ex = db.experiences.find(x => x.id === id);
      if (!ex) break;
      (ex.comments = ex.comments || []).push({ id: uid(), author, content, time: Date.now() });
      saveDB(); toast(tr("回复已发布"), "ok"); renderDetail(id);
      break;
    }
    case "set-type-form": {
      state.formType = t.dataset.type;
      $$(".type-card").forEach(b => b.classList.toggle("on", b.dataset.type === t.dataset.type));
      break;
    }
    case "submit-save": {
      const editId = state.editingId;
      const title = ($("#f-title").value || "").trim();
      const content = ($("#f-content").value || "").trim();
      const path = [...state.formPath];
      const type = state.formType;
      const scene = ($("#f-scene").value || "").trim();
      const tags = ($("#f-tags").value || "").split(/[,，;；]/).map(s => s.trim()).filter(Boolean);
      const author = ($("#f-author").value || "").trim() || tr("匿名");
      if (!title) { toast(tr("请填写标题"), "err"); break; }
      if (!path.length) { toast(tr("请选择所属学科"), "err"); break; }
      if (!content) { toast(tr("请填写内容"), "err"); break; }
      const now = Date.now();
      if (editId) {
        const ex = db.experiences.find(x => x.id === editId);
        if (ex) Object.assign(ex, { title, content, path, type, scene, tags, author, updatedAt: now });
        toast(tr("已保存修改"), "ok");
      } else {
        db.experiences.push({ id: uid(), kind: "vibe", type, title, content, path, scene, tags, author, likes: 0, views: 0, comments: [], createdAt: now });
        toast(tr("已贴上灵感墙"), "ok");
      }
      saveDB();
      location.hash = "#/detail/" + (editId || db.experiences[db.experiences.length - 1].id);
      break;
    }
    case "add-sub": {
      const name = prompt(tr("新增学科名称："), "").trim();
      if (!name) break;
      addNodeToTax(state.formPath.concat(name));
      saveDB(); toast(tr("已添加学科：") + pstr(state.formPath.concat(name)), "ok");
      const holder = t.closest(".f-group");
      if (holder) {
        const oldPick = holder.querySelector("#path-pick");
        const oldAdd = holder.querySelector(".addsub");
        const tmp = document.createElement("div");
        tmp.innerHTML = renderPathPicks(state.formPath);
        if (oldPick) oldPick.replaceWith(tmp.querySelector(".path-pick"));
        if (oldAdd) oldAdd.replaceWith(tmp.querySelector(".addsub"));
      }
      break;
    }
    case "save-nick": {
      const nick = ($("#f-nick").value || "").trim();
      db.meta.nick = nick; saveDB(); toast(tr("昵称已保存"), "ok"); route();
      break;
    }
    case "export": downloadFile("experience-data.json", exportJSON(true)); toast(tr("已导出数据文件"), "ok"); break;
    case "import": { const fi = $("#import-file"); if (fi) fi.click(); break; }
    case "clear-sample": {
      const n = db.experiences.filter(x => x.sample).length;
      if (!n) { toast(tr("没有示例数据"), "err"); break; }
      if (await askConfirm(trf("将删除全部 {0} 条示例灵感。继续？", n), tr("删除"), true)) {
        db.experiences = db.experiences.filter(x => !x.sample);
        saveDB(); toast(tr("示例数据已清除"), "ok"); route();
      }
      break;
    }
    case "clear-all": {
      const n = db.experiences.length;
      if (!n) { toast(tr("数据已是空的"), "err"); break; }
      if (await askConfirm(trf("将清空全部 {0} 条经验（含深度库数据，学科目录与设置保留）。建议先导出备份。继续？", n), tr("清空"), true)) {
        db.experiences = []; saveDB(); toast(tr("已清空"), "ok"); route();
      }
      break;
    }
    case "reset-tax": {
      if (await askConfirm(tr("将学科目录恢复为内置默认（你新增的学科会被移除）。继续？"), tr("恢复"), true)) {
        db.tax = JSON.parse(JSON.stringify(DEFAULT_TAXONOMY));
        saveDB(); toast(tr("学科目录已恢复"), "ok"); renderSettings();
      }
      break;
    }
    case "add-discipline": {
      const parent = ($("#add-parent").value || "").split("/").filter(Boolean);
      const name = ($("#add-name").value || "").trim();
      if (!name) { toast(tr("请输入学科名称"), "err"); break; }
      if (getNode(db.tax, parent.concat(name))) { toast(tr("该学科已存在"), "err"); break; }
      addNodeToTax(parent.concat(name));
      saveDB(); toast(tr("已添加：") + pstr(parent.concat(name)), "ok");
      $("#add-name").value = "";
      fillTaxList(); fillAddParent();
      break;
    }
    case "del-discipline": {
      const p = t.dataset.path.split("/");
      const cnt = countUnder(p);
      if (await askConfirm(trf("删除学科「{0}」？{1}", p[p.length - 1], cnt ? trf("其下已有 {0} 条经验，删除后经验仍保留在「全部学科」中。", cnt) : ""), tr("删除"), true)) {
        removeNodeFromTax(p); saveDB(); toast(tr("已删除学科"), "ok");
        fillTaxList(); fillAddParent();
        if (state.filter.path.length && pathStartsWith(state.filter.path, p)) { state.filter.path = []; renderListPanel(); }
      }
      break;
    }
    case "gh-save": {
      const repo = db.meta.repo;
      repo.owner = ($("#gh-owner").value || "").trim();
      repo.repo = ($("#gh-repo").value || "").trim();
      repo.token = ($("#gh-token").value || "").trim();
      repo.file = ($("#gh-file").value || "").trim() || "experience-data.json";
      repo.branch = ($("#gh-branch").value || "").trim() || "main";
      saveDB(); setGhStatus(tr("配置已保存到本机。点「推送到 GitHub」上传数据，或点「拉取」合并云端数据。"));
      toast(tr("GitHub 配置已保存"), "ok");
      break;
    }
    case "gh-push": {
      const repo = db.meta.repo;
      if (!repo.owner || !repo.repo) { toast(tr("请先填写 GitHub 用户名和仓库名"), "err"); break; }
      setGhStatus(tr("正在连接 GitHub 并推送数据…"));
      try {
        await ghPush(repo.owner, repo.repo, repo.file, exportJSON(true), repo.token, repo.branch);
        setGhStatus(trf("推送成功：已把 {0} 条经验写入 {1} 的 {2}\n现在别人打开页面后点「从 GitHub 拉取并合并」即可同步（公开仓库无需 Token）。", db.experiences.length, repo.owner + "/" + repo.repo, repo.file));
        toast(tr("已推送到 GitHub"), "ok");
      } catch (err) {
        setGhStatus(tr("推送失败：") + err.message);
        toast(tr("推送失败，详见状态栏"), "err");
      }
      break;
    }
    case "gh-pull": {
      const repo = db.meta.repo;
      if (!repo.owner || !repo.repo) { toast(tr("请先填写 GitHub 用户名和仓库名"), "err"); break; }
      setGhStatus(tr("正在从 GitHub 拉取数据…"));
      try {
        const data = await ghPull(repo.owner, repo.repo, repo.file, repo.token, repo.branch);
        if (await askConfirm(trf("云端有 {0} 条经验。合并规则：相同 ID 以云端为准，本地独有保留。继续？", data.experiences.length), tr("合并"))) {
          const byId = new Map(db.experiences.map(x => [x.id, x]));
          data.experiences.forEach(x => { if (x && x.id) byId.set(x.id, x); });
          db.experiences = [...byId.values()];
          if (data.tax && typeof data.tax === "object") for (const k of Object.keys(data.tax)) if (!(k in db.tax)) db.tax[k] = data.tax[k];
          saveDB();
          setGhStatus(trf("拉取成功：本地现有 {0} 条经验（云端 {1} 条已合并）。", db.experiences.length, data.experiences.length));
          toast(tr("已合并云端数据"), "ok");
          route();
        } else setGhStatus(tr("已取消合并。"));
      } catch (err) {
        setGhStatus(tr("拉取失败：") + err.message + "\n" + tr("提示：公开仓库无需 Token；私有仓库需在 Token 填个人访问令牌。"));
        toast(tr("拉取失败，详见状态栏"), "err");
      }
      break;
    }
    case "cancel": location.hash = "#/"; break;
    default: break;
  }
}
function onChange(e) {
  if (e.target.matches && e.target.matches('#path-pick select[data-level]')) {
    const lv = +e.target.dataset.level;
    const v = e.target.value;
    state.formPath = state.formPath.slice(0, lv);
    if (v) state.formPath[lv] = v;
    const holder = e.target.closest(".f-group");
    if (!holder) return;
    const oldPick = holder.querySelector("#path-pick");
    const oldAdd = holder.querySelector(".addsub");
    const tmp = document.createElement("div");
    tmp.innerHTML = renderPathPicks(state.formPath);
    if (oldPick) oldPick.replaceWith(tmp.querySelector(".path-pick"));
    if (oldAdd) oldAdd.replaceWith(tmp.querySelector(".addsub"));
    return;
  }
  if (e.target && e.target.id === "import-file") {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    handleImport(f);
    e.target.value = "";
  }
}
async function handleImport(file) {
  let text;
  try { text = await file.text(); } catch (err) { toast(tr("读取文件失败"), "err"); return; }
  let data;
  try { data = JSON.parse(text); } catch (err) { toast(tr("文件不是有效的 JSON"), "err"); return; }
  if (!data || !Array.isArray(data.experiences)) { toast(tr("数据格式不正确：缺少 experiences 字段"), "err"); return; }
  if (!await askConfirm(trf("将合并 {0} 条经验到本地：\n· 相同 ID 以导入文件为准\n· 本地独有的保留\n· 学科目录自动补充。\n继续？", data.experiences.length), tr("合并导入"))) return;
  const byId = new Map(db.experiences.map(x => [x.id, x]));
  data.experiences.forEach(x => { if (x && x.id) byId.set(x.id, x); });
  db.experiences = [...byId.values()];
  if (data.tax && typeof data.tax === "object") for (const k of Object.keys(data.tax)) if (!(k in db.tax)) db.tax[k] = data.tax[k];
  saveDB(); toast(trf("导入成功，共 {0} 条经验", db.experiences.length), "ok"); route();
}

/* ============ 投稿中心 ============ */
function renderContrib() {
  const ideas = db.experiences.filter(e => e.kind === "vibe" && !e.sample).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  const total = db.experiences.filter(e => !e.sample).length;
  const now = Date.now();
  const week = db.experiences.filter(e => !e.sample && (now - (e.createdAt || 0)) < 7 * 864e5).length;
  const allLikes = db.experiences.filter(e => !e.sample).reduce((s, e) => s + (e.likes || 0), 0);
  const avg = total ? Math.round(allLikes / total * 10) / 10 : 0;
  const guidelines = [
    tr("真实经历过，不是道听途说"),
    tr("有可执行的步骤或方法，不只有观点"),
    tr("标注难度与耗时，让后来者有预期"),
    tr("附上资源与避坑，减少试错成本")
  ];
  $("#app").innerHTML = `
  <div style="max-width:960px;margin:0 auto;padding:26px 16px 60px">
    <h1 class="page-title">${tr("投稿中心")}</h1>
    <p style="color:var(--ink2);font-size:14px;margin:4px 0 22px">${tr("投稿指南")}</p>
    <div class="stats" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:24px">
      <div class="stat"><b>${total}</b><span>${tr("总投稿数")}</span></div>
      <div class="stat"><b>${week}</b><span>${tr("本周新增")}</span></div>
      <div class="stat"><b>${avg}</b><span>${tr("平均点赞")}</span></div>
    </div>
    <div class="set-card">
      <h2>${tr("投稿指南")}</h2>
      <ul class="pit-list" style="margin-top:10px">
        ${guidelines.map(g => `<li>${IC.check}<span>${esc(g)}</span></li>`).join("")}
      </ul>
      <div class="set-btns" style="margin-top:16px">
        <button class="btn primary" data-action="go-submit">${tr("我要投稿")}</button>
      </div>
    </div>
    <div class="set-card" style="margin-top:16px">
      <h2>${trf("灵感投稿墙（{0}）", ideas.length)}</h2>
      ${ideas.length ? `<div class="board" style="columns:2;padding:8px 0 0">${ideas.map(renderNote).join("")}</div>` : `<div class="empty" style="padding:30px"><b>${tr("还没有投稿")}</b>${tr("成为第一个投稿的人吧。")}<button class="btn primary" style="margin-top:12px" data-action="go-submit">${tr("我要投稿")}</button></div>`}
    </div>
  </div>`;
}

/* ============ 启动 ============ */
function init() {
  loadDB();
  window.addEventListener("hashchange", route);
  document.addEventListener("click", onClick);
  document.addEventListener("change", onChange);
  $("#btn-submit").addEventListener("click", () => { location.hash = "#/submit"; });
  $("#lang-btn").addEventListener("click", () => { setLang(lang === "en" ? "zh" : "en"); route(); toast(lang === "en" ? "Switched to English" : "已切换为中文", "ok"); });
  $("#top-q").addEventListener("keydown", e => { if (e.key === "Enter") { state.filter.q = e.target.value; location.hash = "#/"; route(); } });
  route();
}
init();
</script>
</body>
