<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeepExperience · 深度经验库</title>
<meta name="description" content="按学科门类整理的系统性学习经验：学习路径、方法论、资源与避坑指南。">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='12'%20fill='%23B03A2E'/%3E%3Ctext%20x='32'%20y='45'%20font-size='38'%20text-anchor='middle'%20fill='%23F5F1E8'%20font-family='serif'%20font-weight='700'%3E%E6%B7%B1%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<style>
:root{
  --paper:#F5F1E8; --paper2:#EFE9DB; --card:#FBF8F1; --ink:#23272E; --ink2:#5C6270;
  --line:#DDD6C4; --line2:#CFC7B2; --blue:#23405E; --blue2:#33557A; --red:#B03A2E; --red2:#C95543;
  --chip:#EAE3D2; --ok:#2F7E6D;
  --serif:'Noto Serif SC','Songti SC','SimSun',serif;
  --sans:'Noto Sans SC','Microsoft YaHei',sans-serif;
  --shadow:0 1px 2px rgba(35,40,46,.05), 0 4px 14px rgba(35,40,46,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.7}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}
a{color:var(--blue2);text-decoration:none}
a:hover{text-decoration:underline}
::selection{background:#E8CFC8}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.hidden{display:none!important}

/* ===== 顶栏 ===== */
#topbar{position:sticky;top:0;z-index:50;background:rgba(245,241,232,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.seal{width:34px;height:34px;border-radius:7px;background:var(--red);color:var(--paper);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:900;font-size:19px;flex:none;box-shadow:inset 0 -2px 0 rgba(0,0,0,.18)}
.brand-name{font-family:var(--serif);font-weight:700;font-size:17px;letter-spacing:.5px}
.brand-sub{font-size:11px;color:var(--ink2);letter-spacing:2px;margin-top:-2px}
.nav{display:flex;gap:4px;margin-left:8px}
.nav a{padding:7px 13px;border-radius:8px;color:var(--ink2);font-size:14px;text-decoration:none;font-weight:500}
.nav a:hover{background:var(--paper2);color:var(--ink)}
.nav a.on{color:var(--red);background:rgba(176,58,46,.08);font-weight:600}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.top-search{position:relative}
.top-search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);stroke:var(--ink2)}
.top-search input{width:200px;padding:8px 12px 8px 32px;border:1px solid var(--line);border-radius:20px;background:var(--card);outline:none}
.top-search input:focus{border-color:var(--blue2)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--card);color:var(--ink);padding:8px 16px;border-radius:9px;font-size:14px;font-weight:600;transition:all .15s}
.btn:hover{border-color:var(--blue2);color:var(--blue2)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#F2EFE6}
.btn.primary:hover{background:var(--blue2);color:#F2EFE6}
.btn.danger{background:transparent;border-color:#D8A6A0;color:var(--red)}
.btn.danger:hover{background:rgba(176,58,46,.06);border-color:var(--red)}
.btn.small{padding:5px 11px;font-size:13px;border-radius:7px}
.btn svg{flex:none}
.lang-btn{background:transparent;border:1px solid var(--line2);color:var(--ink2);font-size:12.5px;font-weight:600;padding:7px 12px;border-radius:20px;transition:all .15s}
.lang-btn:hover{border-color:var(--blue2);color:var(--blue2)}
.link-plain{color:var(--ink2);font-size:13px;padding:7px 11px;border-radius:8px;text-decoration:none;border:1px dashed var(--line2)}
.link-plain:hover{color:var(--blue2);border-color:var(--blue2);text-decoration:none}

/* ===== Hero ===== */
.hero{max-width:1240px;margin:0 auto;padding:52px 20px 30px;text-align:center}
.hero .eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:13px;letter-spacing:3px;color:var(--red);border:1px solid rgba(176,58,46,.35);border-radius:20px;padding:5px 16px;background:rgba(176,58,46,.05)}
.hero h1{font-family:var(--serif);font-weight:900;font-size:clamp(30px,5vw,48px);line-height:1.25;margin:18px 0 10px;letter-spacing:1px}
.hero h1 em{font-style:normal;color:var(--red)}
.hero p{color:var(--ink2);font-size:16px;max-width:560px;margin:0 auto}
.hero .big-search{max-width:640px;margin:24px auto 0;position:relative}
.hero .big-search input{width:100%;padding:15px 20px 15px 48px;border:1px solid var(--line2);border-radius:14px;background:var(--card);font-size:16px;outline:none;box-shadow:var(--shadow)}
.hero .big-search input:focus{border-color:var(--blue2)}
.hero .big-search svg{position:absolute;left:17px;top:50%;transform:translateY(-50%);stroke:var(--ink2)}
.hero .stats{display:flex;justify-content:center;gap:34px;margin-top:26px}
.stat{display:flex;flex-direction:column;align-items:center}
.stat b{font-family:var(--serif);font-size:26px;color:var(--ink)}
.stat span{font-size:12px;color:var(--ink2);letter-spacing:1px}

/* ===== 探索布局 ===== */
#app{max-width:1240px;margin:0 auto;padding:6px 20px 60px}
.layout{display:grid;grid-template-columns:250px 1fr;gap:26px;align-items:start}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}

/* 学科树 */
.tree{position:sticky;top:76px;max-height:calc(100vh - 100px);overflow:auto;padding:14px 10px}
.tree-head{display:flex;align-items:center;justify-content:space-between;padding:2px 8px 10px;font-family:var(--serif);font-weight:700;font-size:15px;border-bottom:1px solid var(--line);margin-bottom:8px}
.tree-head button{font-size:12px;color:var(--blue2);background:none;border:none;padding:2px 6px}
.tree input{width:100%;padding:6px 10px;border:1px solid var(--line);border-radius:7px;background:var(--paper);font-size:13px;margin-bottom:8px;outline:none}
.tree ul{list-style:none}
.tree ul ul{margin-left:14px;border-left:1px solid var(--line2);padding-left:8px}
.t-node{display:flex;align-items:center;gap:5px;width:100%;text-align:left;background:none;border:none;padding:5px 7px;border-radius:6px;font-size:13.5px;color:var(--ink2)}
.t-node:hover{background:var(--paper2);color:var(--ink)}
.t-node.on{background:rgba(35,64,94,.1);color:var(--blue);font-weight:600}
.t-node .caret{width:14px;height:14px;flex:none;display:inline-flex;align-items:center;justify-content:center;transition:transform .15s}
.t-node.closed .caret{transform:rotate(-90deg)}
.t-node .cnt{margin-left:auto;font-size:11px;color:var(--ink2);background:var(--paper2);border-radius:8px;padding:0 7px}
.t-node.on .cnt{background:var(--blue);color:#fff}
.t-node.muted{color:#A9A294}

/* 列表区 */
.list-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--line)}
.crumb{display:flex;align-items:center;gap:6px;font-family:var(--serif);font-size:15px;font-weight:700;flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.crumb .dot{color:var(--red);font-size:12px}
.crumb .seal-tag{font-family:var(--sans);font-size:11px;background:var(--red);color:var(--paper);border-radius:5px;padding:2px 8px;letter-spacing:1px}
.sort-group{display:flex;gap:4px;background:var(--paper2);border-radius:8px;padding:3px}
.sort-group button{border:none;background:transparent;padding:5px 11px;border-radius:6px;font-size:13px;color:var(--ink2)}
.sort-group button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(35,40,46,.12)}
.tag-filter{display:flex;gap:6px;flex-wrap:wrap;padding:0 18px 12px}
.chip{border:1px solid var(--line2);background:var(--paper);border-radius:14px;padding:3px 12px;font-size:12.5px;color:var(--ink2);cursor:pointer}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}

/* 卡片 */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 18px 14px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s;position:relative}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(35,40,46,.1)}
.card .meta-row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink2)}
.card .meta-row .path{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.card h3{font-family:var(--serif);font-size:17px;line-height:1.45;font-weight:700}
.card h3 a{color:var(--ink);text-decoration:none}
.card h3 a:hover{color:var(--blue2)}
.card .excerpt{font-size:13.5px;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.65}
.card .tags{display:flex;flex-wrap:wrap;gap:5px}
.card .tags span{font-size:11.5px;background:var(--chip);color:var(--ink2);border-radius:4px;padding:1px 7px}
.card .foot{display:flex;align-items:center;gap:12px;border-top:1px dashed var(--line2);padding-top:10px;font-size:12px;color:var(--ink2)}
.card .foot .sp{flex:1}
.card .foot .like.on{color:var(--red)}
.card .foot .badge{font-size:11px;border:1px solid #D8A6A0;color:var(--red);border-radius:4px;padding:0 6px}
.card .foot .badge.sample{color:#A3822C;border-color:#D9C07C}
.diff{display:inline-flex;gap:2px;align-items:center}
.diff i{width:5px;height:11px;border-radius:2px;background:var(--line2)}
.diff i.f{background:var(--red2)}
.empty{padding:70px 20px;text-align:center;color:var(--ink2)}
.empty b{display:block;font-family:var(--serif);font-size:20px;color:var(--ink);margin-bottom:6px}
.loadmore{display:block;margin:6px auto 26px;padding:9px 30px}

/* ===== 详情 ===== */
.detail{max-width:780px;margin:0 auto}
.detail .topline{display:flex;align-items:center;gap:10px;margin-bottom:16px;font-size:13px;color:var(--ink2)}
.detail .topline .back{border:1px solid var(--line2);border-radius:8px;padding:6px 14px;color:var(--ink2);font-size:13px;background:var(--card);text-decoration:none}
.detail .topline .back:hover{color:var(--blue2);border-color:var(--blue2);text-decoration:none}
.detail article{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:34px 38px;box-shadow:var(--shadow)}
.detail h1{font-family:var(--serif);font-size:26px;line-height:1.4;font-weight:900;margin:10px 0 6px}
.detail .sub{color:var(--ink2);font-size:14.5px;border-left:3px solid var(--red);padding-left:12px;margin:8px 0 18px}
.detail .meta{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--ink2);padding-bottom:16px;border-bottom:1px dashed var(--line2);margin-bottom:18px}
.detail .meta b{color:var(--ink);font-weight:600}
.detail h2{font-family:var(--serif);font-size:19px;font-weight:700;margin:26px 0 12px;display:flex;align-items:center;gap:8px}
.detail h2::before{content:"";width:16px;height:3px;background:var(--red);border-radius:2px;flex:none}
.detail .body{font-size:15px;line-height:1.95;white-space:pre-wrap;word-break:break-word;color:#2B2F37}
.detail .body a,.res-list a{color:var(--blue2);word-break:break-all}
.panel-inline{border:1px solid var(--line);border-radius:10px;background:var(--paper);padding:16px 18px}
.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 20px}
.info-grid .it{font-size:13px}
.info-grid .it .k{color:var(--ink2);font-size:12px}
.info-grid .it .v{font-weight:600;font-size:14px}

/* 步骤时间轴 */
.tl{display:grid;grid-template-columns:52px 20px 1fr;gap:0;margin-top:6px}
.tl .t-no{font-family:var(--serif);font-weight:900;color:var(--red);font-size:16px;text-align:right;padding:10px 6px;line-height:1.5}
.tl .t-ax{position:relative;display:flex;justify-content:center}
.tl .t-ax::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:2px;background:var(--line2)}
.tl .t-dot{width:12px;height:12px;border-radius:50%;background:var(--card);border:3px solid var(--red);z-index:1;align-self:flex-start;margin-top:18px}
.tl .t-content{padding:8px 4px 18px;font-size:14px}
.tl .t-content b{font-size:14.5px;display:block;margin-bottom:2px}
.tl .t-content p{color:var(--ink2);font-size:13.5px}

/* 资源与避坑 */
.res-list{list-style:none;display:flex;flex-direction:column;gap:8px}
.res-list li{display:flex;gap:10px;align-items:flex-start;font-size:14px;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:9px 13px}
.res-list li svg{flex:none;margin-top:4px}
.pit-list{list-style:none;display:flex;flex-direction:column;gap:8px}
.pit-list li{display:flex;gap:10px;font-size:14px;background:rgba(176,58,46,.05);border:1px solid #E3C4BE;border-radius:8px;padding:9px 13px;color:#5A3A35}
.pit-list li svg{flex:none;margin-top:4px;stroke:var(--red)}

/* 互动 */
.actions{display:flex;gap:10px;margin:18px 0 30px;flex-wrap:wrap}
.actions .btn.like.on{background:rgba(176,58,46,.08);border-color:var(--red);color:var(--red)}
.comments h3{font-family:var(--serif);font-size:18px;margin-bottom:14px}
.cmt-form{display:flex;gap:10px;margin-bottom:16px}
.cmt-form input[type=text]{flex:0 0 130px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
.cmt-form textarea{flex:1;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);resize:vertical;min-height:42px}
.cmt{display:flex;gap:10px;padding:12px 0;border-bottom:1px dashed var(--line2);font-size:14px}
.cmt .av{width:30px;height:30px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;flex:none}
.cmt .cm{border:1px solid var(--line);background:var(--paper);border-radius:9px;padding:8px 12px;flex:1}
.cmt .cm .who{font-size:12px;color:var(--ink2);margin-bottom:2px}
.cmt .cm .who b{color:var(--ink)}

/* ===== 提交表单 ===== */
.form-wrap{max-width:760px;margin:0 auto}
.form-wrap h1{font-family:var(--serif);font-size:26px;font-weight:900;margin-bottom:4px}
.form-wrap .lead{color:var(--ink2);font-size:14px;margin-bottom:22px}
.form-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:30px 34px;box-shadow:var(--shadow)}
.f-group{margin-bottom:20px}
.f-group label{display:block;font-weight:600;font-size:14px;margin-bottom:7px}
.f-group label .req{color:var(--red)}
.f-group .hint{font-size:12px;color:var(--ink2);margin-top:4px}
.f-group input[type=text],.f-group input[type=url],.f-group textarea,.f-group select{width:100%;padding:10px 13px;border:1px solid var(--line);border-radius:9px;background:var(--paper);outline:none;transition:border-color .15s}
.f-group input:focus,.f-group textarea:focus,.f-group select:focus{border-color:var(--blue2)}
.f-group textarea{resize:vertical;min-height:110px;line-height:1.7}
.f-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.path-pick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.path-pick select{padding:9px 8px;border:1px solid var(--line);border-radius:8px;background:var(--paper);font-size:13px;min-width:0;outline:none}
.path-pick select:focus{border-color:var(--blue2)}
.addsub{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--blue2);background:none;border:1px dashed var(--blue2);border-radius:6px;padding:3px 9px;margin-top:6px}
.sub-list{display:flex;flex-direction:column;gap:8px}
.sub-row{display:grid;grid-template-columns:1fr 2fr 36px;gap:8px;align-items:center}
.sub-row .sub-row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;grid-column:1/3}
.sub-row input{padding:8px 11px;border:1px solid var(--line);border-radius:8px;background:var(--paper);font-size:13px;outline:none}
.sub-row input:focus{border-color:var(--blue2)}
.plus-line{margin-top:10px}
.plus-line button{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--blue2);background:none;border:1px dashed var(--blue2);border-radius:8px;padding:6px 13px}
.diff-pick{display:flex;gap:8px;flex-wrap:wrap}
.diff-pick button{width:42px;height:34px;border:1px solid var(--line2);background:var(--paper);border-radius:8px;font-size:14px;color:var(--ink2)}
.diff-pick button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.form-actions{display:flex;gap:12px;margin-top:26px;padding-top:20px;border-top:1px dashed var(--line2)}
.preview-line{margin-top:20px;background:var(--paper);border:1px dashed var(--line2);border-radius:10px;padding:14px 16px;font-size:13px;color:var(--ink2);white-space:pre-wrap}

/* ===== 设置 ===== */
.set-wrap{max-width:760px;margin:0 auto}
.set-wrap h1{font-family:var(--serif);font-size:26px;font-weight:900;margin-bottom:20px}
.set-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:26px 30px;margin-bottom:18px;box-shadow:var(--shadow)}
.set-card h2{font-family:var(--serif);font-size:18px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.set-card h2::before{content:"";width:14px;height:3px;background:var(--red);border-radius:2px}
.set-row{display:grid;grid-template-columns:140px 1fr;gap:10px;align-items:center;margin-bottom:12px}
.set-row label{font-size:13.5px;color:var(--ink2);font-weight:600}
.set-row input{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);outline:none}
.set-row input:focus{border-color:var(--blue2)}
.set-btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.gh-status{font-size:12.5px;color:var(--ink2);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:9px 13px;margin-top:12px;white-space:pre-wrap;max-height:140px;overflow:auto;font-family:ui-monospace,Consolas,monospace}
.ol{margin:8px 0 8px 20px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.ol code{background:var(--paper2);border:1px solid var(--line);border-radius:5px;padding:1px 7px;font-size:12.5px;word-break:break-all}
.note{font-size:12.5px;color:var(--ink2);border-left:3px solid #D9C07C;background:rgba(217,192,124,.1);padding:9px 13px;border-radius:0 8px 8px 0;margin-top:12px}

/* ===== Toast & Modal ===== */
#toast-wrap{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--ink);color:var(--paper);padding:10px 20px;border-radius:10px;font-size:13.5px;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:tin .2s ease}
.toast.err{background:var(--red)}
.toast.ok{background:var(--ok)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#modal-root{position:fixed;inset:0;z-index:150;display:none}
#modal-root.show{display:flex;align-items:center;justify-content:center;background:rgba(35,40,46,.45);padding:20px}
.modal{background:var(--card);border-radius:14px;max-width:440px;width:100%;padding:26px 28px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal h3{font-family:var(--serif);font-size:18px;margin-bottom:10px}
.modal p{font-size:14px;color:var(--ink2);margin-bottom:18px;white-space:pre-wrap}
.modal .mb{display:flex;justify-content:flex-end;gap:10px}

footer{border-top:1px solid var(--line);padding:26px 20px;text-align:center;color:var(--ink2);font-size:12.5px}
footer a{color:var(--blue2)}

@media (max-width:980px){
  .layout{grid-template-columns:1fr}

/* ============ 存储（localStorage，失败时降级为内存） ============ */
const store = (() => {
  let mem = {}, ok = true;
  try { localStorage.setItem("__t", "1"); localStorage.removeItem("__t"); } catch(e) { ok = false; }
  return {
    ok,
    get(k) { if (ok) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch(e) { return null; } } return mem[k] ?? null; },
    set(k, v) { mem[k] = v; if (ok) { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} } }
  };
})();

}
function saveDB() { store.set(DB_KEY, db); }
function mergeTax(defaultTax, custom) {
  const out = {};
  for (const k of Object.keys(defaultTax)) out[k] = defaultTax[k];
  for (const k of Object.keys(custom)) out[k] = custom[k];
  return out;
}

  let n = db.tax;
  for (const p of pathArr) {
    if (!(p in n)) n[p] = {};
    n = n[p];
  }
}
function removeNodeFromTax(pathArr) {
  if (pathArr.length < 1) return false;
  const parent = getNode(db.tax, pathArr.slice(0, -1));
  const last = pathArr[pathArr.length - 1];
  if (parent && typeof parent === "object" && last in parent) { delete parent[last]; return true; }
  return false;
}
function collectAllPaths(node, prefix, out) {
  if (!node || typeof node !== "object") return;
  for (const k of Object.keys(node)) {
    const p = prefix.concat(k);
    out.push(p);
    if (node[k] && typeof node[k] === "object") collectAllPaths(node[k], p, out);
  }
}
function pathStartsWith(p, q) { return p.length >= q.length && q.every((v, i) => p[i] === v); }
function pathPrefix(p, len) { return p.slice(0, len); }
function expMatchesPath(exp, q) {
  if (!q || q.length === 0) return true;
  return pathStartsWith(exp.path, q);
}
function countUnder(nodePath) { return db.experiences.filter(e => expMatchesPath(e, nodePath)).length; }
function siblingsOf(pathArr) {
  const parent = getNode(db.tax, pathArr.slice(0, -1));
  if (parent && typeof parent === "object") return Object.keys(parent);
  return [];
}

/* ============ 过滤 / 排序 ============ */
function filterExps(filter) {
  const q = (filter.q || "").trim().toLowerCase();
  let list = db.experiences.filter(e => e.kind === "deep");
  if (filter.path && filter.path.length) list = list.filter(e => expMatchesPath(e, filter.path));
  if (filter.tag) list = list.filter(e => (e.tags || []).includes(filter.tag));
  if (q) list = list.filter(e => [e.title, e.summary, e.content, (e.tags||[]).join(" "), e.author].join(" ").toLowerCase().includes(q));
  const sort = filter.sort || "new";
  list = [...list].sort((a, b) => {
    if (sort === "hot") return (b.views||0) - (a.views||0);
    if (sort === "like") return (b.likes||0) - (a.likes||0);
    return (b.createdAt||0) - (a.createdAt||0);
  });
  return list;
}
function allTags() {
  const m = {};
  db.experiences.forEach(e => (e.tags||[]).forEach(t => { m[t] = (m[t]||0)+1; }));
  return Object.entries(m).sort((a,b) => b[1]-a[1]);
}

/* ============ GitHub 同步 ============ */
function b64Encode(str){ return btoa(unescape(encodeURIComponent(str))); }
function b64Decode(str){ return decodeURIComponent(escape(atob(str.replace(/\s/g,"")))); }
async function ghGetFile(owner, repo, path, token, branch) {
  const headers = { "Accept": "application/vnd.github+json" };
  if (token) headers["Authorization"] = "token " + token;
  const url = `https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/contents/${path.split("/").map(encodeURIComponent).join("/")}${token && branch ? "?ref="+encodeURIComponent(branch) : ""}`;
  const r = await fetch(url, { headers });
  if (r.status === 404) return null;
  if (!r.ok) throw new Error("GitHub 读取失败（HTTP " + r.status + "），请检查仓库名/分支/Token 权限");
  return await r.json();
}
async function ghPush(owner, repo, path, content, token, branch) {
  if (!token) throw new Error("未配置 Token，无法推送");
  const existing = await ghGetFile(owner, repo, path, token, branch);
  const body = { message: "update experience data", content: b64Encode(content), branch: branch || "main" };
  if (existing && existing.sha) body.sha = existing.sha;
  const url = `https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/contents/${path.split("/").map(encodeURIComponent).join("/")}`;
  const r = await fetch(url, { method: "PUT", headers: { "Authorization": "token " + token, "Accept": "application/vnd.github+json", "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (!r.ok) { const t = await r.text(); throw new Error("GitHub 推送失败（HTTP " + r.status + "）" + (t.length > 160 ? t.slice(0, 160) : t)); }
  return true;
}
async function ghPull(owner, repo, path, token, branch) {
  let jsonText = null;
  if (token) {
    const f = await ghGetFile(owner, repo, path, token, branch);
    if (f && f.content) jsonText = b64Decode(f.content);
  } else {
    const url = `https://raw.githubusercontent.com/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/${encodeURIComponent(branch||"main")}/${path.split("/").map(encodeURIComponent).join("/")}`;
    const r = await fetch(url);
    if (r.ok) jsonText = await r.text();
  }
  if (!jsonText) throw new Error("云端没有数据文件或无法访问");
  const data = JSON.parse(jsonText);
  if (!data || !Array.isArray(data.experiences)) throw new Error("云端数据格式不正确");
  return data;
}
function exportJSON(pretty) { return JSON.stringify({ version:1, exportedAt:new Date().toISOString(), meta:db.meta, tax:db.tax, experiences:db.experiences }, null, pretty ? 2 : 0); }
function downloadFile(name, content, mime) {
  const blob = new Blob([content], { type: mime || "application/json;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 300);
}
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); return true; }
  catch(e) { return false; }
}

function computeTreeSearch(q) {
  const matchKeys = new Set(), ancKeys = new Set();
  if (!q) return { matchKeys, ancKeys };
  const all = []; collectAllPaths(db.tax, [], all);
  for (const p of all) {
    if (p[p.length - 1].toLowerCase().includes(q)) {
      p.forEach((_, i) => { const k = p.slice(0, i + 1).join("/"); (i === p.length - 1 ? matchKeys : ancKeys).add(k); });
    }
  }
  return { matchKeys, ancKeys };
}
function renderTree() {

function renderTreeLevel(node, pathArr, q, matchKeys, ancKeys) {

/* ============ 路由 ============ */
function localizeStatic() {
  $$("[data-i18n]").forEach(el => { el.textContent = tr(el.dataset.i18n); });
  $$("[data-i18n-ph]").forEach(el => { el.placeholder = tr(el.dataset.i18nPh); });
  const lb = $("#lang-btn");
  if (lb) lb.textContent = lang === "en" ? "中文" : "English";
}
function route() {
  const h = location.hash.slice(1) || "/";
  let r = "home";
  if (h.startsWith("/detail/")) { renderDetail(decodeURIComponent(h.slice(8))); r = "detail"; }
  else if (h === "/submit") { renderSubmit(); r = "submit"; }
  else if (h.startsWith("/edit/")) { renderSubmit(decodeURIComponent(h.slice(6))); r = "submit"; }
  else if (h === "/contrib") { renderContrib(); r = "contrib"; }
  else if (h === "/mine") { renderMine(); r = "mine"; }
  else if (h === "/settings") { renderSettings(); r = "settings"; }
  else renderHome();
  state.route = r;
  const navMap = { home: "#/", contrib: "#/contrib", submit: "#/submit", mine: "#/mine", settings: "#/settings" };
  $$("#nav a").forEach(a => a.classList.toggle("on", a.getAttribute("href") === navMap[r]));
  document.title = (r === "detail") ? document.title : (lang === "en" ? "DeepExperience · Deep Experience Hub" : "DeepExperience · 深度经验库");
  localizeStatic();
  window.scrollTo(0, 0);
}

/* ============ 全局事件 ============ */
function setGhStatus(t) { const el = $("#gh-status"); if (el) el.textContent = t; }
function updateLikes(id) {
  const e = db.experiences.find(x => x.id === id);
  if (!e) return;
  const on = state.liked.has(id);
  $$(`[data-action="like"][data-id="${id}"]`).forEach(b => {
    b.classList.toggle("on", on);
    b.innerHTML = IC.like + " " + (e.likes || 0);
  });
}
async function onClick(e) {
  const t = e.target.closest("[data-action]");
  if (!t) return;
  const act = t.dataset.action;
  const id = t.dataset.id;
  switch (act) {
    case "pick-path": {
      const p = t.dataset.path ? t.dataset.path.split("/") : [];
      state.filter.path = p; state.filter.tag = ""; state.page = 1;
      const tree = $("#tree");
      if (tree) { tree.innerHTML = renderTree(); bindTreeQ(); }
      renderListPanel();
      break;
    }
    case "toggle-node": {
      const key = t.dataset.path;
      if (state.openNodes.has(key)) state.openNodes.delete(key); else state.openNodes.add(key);
      const tree = $("#tree");
      if (tree) { tree.innerHTML = renderTree(); bindTreeQ(); }
      break;
    }
    case "expand-all": {
      const all = []; collectAllPaths(db.tax, [], all);
      all.forEach(p => state.openNodes.add(p.join("/")));
      const tree = $("#tree");
      if (tree) { tree.innerHTML = renderTree(); bindTreeQ(); }
      break;
    }
    case "set-sort": state.filter.sort = t.dataset.sort; renderListPanel(); break;
    case "set-tag": state.filter.tag = state.filter.tag === t.dataset.tag ? "" : t.dataset.tag; renderListPanel(); break;
    case "clear-q": state.filter.q = ""; state.page = 1; const hq = $("#hero-q"); if (hq) hq.value = ""; renderListPanel(); break;
    case "load-more": state.page++; renderListPanel(); break;
    case "go-submit": location.hash = "#/submit"; break;
    case "like": {
      const ex = db.experiences.find(x => x.id === id);
      if (!ex) break;
      if (state.liked.has(id)) { state.liked.delete(id); ex.likes = Math.max(0, (ex.likes || 0) - 1); }
      else { state.liked.add(id); ex.likes = (ex.likes || 0) + 1; }
      saveDB(); updateLikes(id);
      break;
    }
    case "edit": location.hash = "#/edit/" + encodeURIComponent(id); break;
    case "del": {
      const ex = db.experiences.find(x => x.id === id);
      if (!ex) break;
      if (await askConfirm(trf("确定删除《{0}》？删除后不可恢复。", ex.title), tr("删除"), true)) {
        db.experiences = db.experiences.filter(x => x.id !== id);
        saveDB(); toast(tr("已删除"), "ok");
        if (state.route === "detail") location.hash = "#/"; else route();
      }
      break;
    }
    case "share": {
      const ex = db.experiences.find(x => x.id === id);
      if (!ex) break;
      const txt = `${lang === "en" ? "[" + tx(ex, "title") + "]" : "【" + ex.title + "】"}\n${tr("学科")}: ${pstr(ex.path)}\n${tx(ex, "summary")}\n— ${tr("来自 DeepExperience 深度经验库")}`;
      const okc = await copyText(txt);
      toast(okc ? tr("分享文本已复制") : tr("复制失败，请长按手动复制"), okc ? "ok" : "err");
      break;
    }
    case "copy-link": {
      const okc = await copyText(location.href);
      toast(okc ? tr("页面链接已复制（发布后可发给他人直接打开）") : tr("复制失败"), okc ? "ok" : "err");
      break;
    }
    case "comment-submit": {
      const author = ($("#cmt-author").value || "").trim() || tr("匿名");
      const content = ($("#cmt-content").value || "").trim();
      if (!content) { toast(tr("评论内容不能为空"), "err"); break; }
      const ex = db.experiences.find(x => x.id === id);
      if (!ex) break;
      (ex.comments = ex.comments || []).push({ id: uid(), author, content, time: Date.now() });
      saveDB(); toast(tr("评论已发布"), "ok"); renderDetail(id);
      break;
    }
    case "submit-save": {
      const editId = state.editingId;
      const title = ($("#f-title").value || "").trim();
      const summary = ($("#f-summary").value || "").trim();
      const content = ($("#f-content").value || "").trim();
      const path = [...state.formPath];
      const steps = $$("#steps .sub-row").map(r => ({ t: (r.querySelector(".st").value || "").trim(), d: (r.querySelector(".sd").value || "").trim() })).filter(x => x.t || x.d);
      const resources = $$("#res .sub-row").map(r => ({ n: (r.querySelector(".rn").value || "").trim(), u: (r.querySelector(".ru").value || "").trim() })).filter(x => x.n || x.u);
      const pitfalls = $$("#pits .pt").map(i => (i.value || "").trim()).filter(Boolean);
      const difficulty = state.formDiff;
      const effort = ($("#f-effort").value || "").trim();
      const tags = ($("#f-tags").value || "").split(/[,，;；]/).map(s => s.trim()).filter(Boolean);
      const author = ($("#f-author").value || "").trim() || tr("匿名");
      if (!title) { toast(tr("请填写标题"), "err"); break; }
      if (!path.length) { toast(tr("请选择所属学科"), "err"); break; }
      if (!summary) { toast(tr("请填写一句话总结"), "err"); break; }
      if (!content) { toast(tr("请填写经验正文"), "err"); break; }
      const now = Date.now();
      if (editId) {
        const ex = db.experiences.find(x => x.id === editId);
        if (ex) Object.assign(ex, { title, summary, content, path, steps, resources, pitfalls, difficulty, effort, tags, author, updatedAt: now });
        toast(tr("已保存修改"), "ok");
      } else {
        db.experiences.push({ id: uid(), kind: "deep", title, summary, content, path, steps, resources, pitfalls, difficulty, effort, tags, author, likes: 0, views: 0, comments: [], createdAt: now });
        toast(tr("发布成功"), "ok");
      }
      saveDB();
      location.hash = "#/detail/" + (editId || db.experiences[db.experiences.length - 1].id);
      break;
    }
    case "add-step": $("#steps").insertAdjacentHTML("beforeend", `<div class="sub-row"><input class="st" type="text" placeholder="${tr("步骤名")}"><input class="sd" type="text" placeholder="${tr("这一步做什么、多久、怎么检验")}"><button class="btn small danger" data-action="del-row">${IC.x}</button></div>`); break;
    case "add-res": $("#res").insertAdjacentHTML("beforeend", `<div class="sub-row"><input class="rn" type="text" placeholder="${tr("资源名")}"><div class="sub-row2"><input class="ru" type="url" placeholder="${tr("链接（http/https）")}"></div><button class="btn small danger" data-action="del-row">${IC.x}</button></div>`); break;
    case "add-pit": $("#pits").insertAdjacentHTML("beforeend", `<div class="sub-row" style="grid-template-columns:1fr 36px"><input class="pt" type="text" placeholder="${tr("容易踩的坑 / 教训")}"><button class="btn small danger" data-action="del-row">${IC.x}</button></div>`); break;
    case "del-row": { const row = t.closest(".sub-row"); if (row) row.remove(); break; }
    case "set-diff": {
      state.formDiff = +t.dataset.v;
      $$(".diff-pick button").forEach(b => b.classList.toggle("on", b.dataset.v === t.dataset.v));
      const lb = $("#diff-label"); if (lb) lb.textContent = tr(["入门", "初学", "进阶", "高难", "硬核"][state.formDiff - 1]);
      break;
    }
    case "add-sub": {
      const name = prompt(tr("新增学科名称："), "").trim();
      if (!name) break;
      addNodeToTax(state.formPath.concat(name));
      saveDB(); toast(tr("已添加学科：") + pstr(state.formPath.concat(name)), "ok");
      const holder = t.closest(".f-group");
      if (holder) {
        const oldPick = holder.querySelector("#path-pick");
        const oldAdd = holder.querySelector(".addsub");
        const tmp = document.createElement("div");
        tmp.innerHTML = renderPathPicks(state.formPath);
        if (oldPick) oldPick.replaceWith(tmp.querySelector(".path-pick"));
        if (oldAdd) oldAdd.replaceWith(tmp.querySelector(".addsub"));
      }
      break;
    }
    case "save-nick": {
      const nick = ($("#f-nick").value || "").trim();
      db.meta.nick = nick; saveDB(); toast(tr("昵称已保存"), "ok"); route();
      break;
    }
    case "export": downloadFile("deepexperience-data.json", exportJSON(true)); toast(tr("已导出数据文件"), "ok"); break;
    case "import": { const fi = $("#import-file"); if (fi) fi.click(); break; }
    case "clear-sample": {
      const n = db.experiences.filter(x => x.sample).length;
      if (!n) { toast(tr("没有示例数据"), "err"); break; }
      if (await askConfirm(trf("将删除全部 {0} 条示例经验。继续？", n), tr("删除"), true)) {
        db.experiences = db.experiences.filter(x => !x.sample);
        saveDB(); toast(tr("示例数据已清除"), "ok"); route();
      }
      break;
    }
    case "clear-all": {
      const n = db.experiences.length;
      if (!n) { toast(tr("数据已是空的"), "err"); break; }
      if (await askConfirm(trf("将清空全部 {0} 条经验（含灵感站数据，学科目录与设置保留）。建议先导出备份。继续？", n), tr("清空"), true)) {
        db.experiences = []; saveDB(); toast(tr("已清空"), "ok"); route();
      }
      break;
    }
    case "reset-tax": {
      if (await askConfirm(tr("将学科目录恢复为内置默认（你新增的学科会被移除）。继续？"), tr("恢复"), true)) {
        db.tax = JSON.parse(JSON.stringify(DEFAULT_TAXONOMY));
        saveDB(); toast(tr("学科目录已恢复"), "ok"); renderSettings();
      }
      break;
    }
    case "add-discipline": {
      const parent = ($("#add-parent").value || "").split("/").filter(Boolean);
      const name = ($("#add-name").value || "").trim();
      if (!name) { toast(tr("请输入学科名称"), "err"); break; }
      if (getNode(db.tax, parent.concat(name))) { toast(tr("该学科已存在"), "err"); break; }
      addNodeToTax(parent.concat(name));
      saveDB(); toast(tr("已添加：") + pstr(parent.concat(name)), "ok");
      $("#add-name").value = "";
      fillTaxList(); fillAddParent();
      break;
    }
    case "del-discipline": {
      const p = t.dataset.path.split("/");
      const cnt = countUnder(p);
      if (await askConfirm(trf("删除学科「{0}」？{1}", p[p.length - 1], cnt ? trf("其下已有 {0} 条经验，删除后经验仍保留在「全部学科」中。", cnt) : ""), tr("删除"), true)) {
        removeNodeFromTax(p); saveDB(); toast(tr("已删除学科"), "ok");
        fillTaxList(); fillAddParent();
        if (state.filter.path.length && pathStartsWith(state.filter.path, p)) { state.filter.path = []; renderListPanel(); }
      }
      break;
    }
    case "gh-save": {
      const repo = db.meta.repo;
      repo.owner = ($("#gh-owner").value || "").trim();
      repo.repo = ($("#gh-repo").value || "").trim();
      repo.token = ($("#gh-token").value || "").trim();
      repo.file = ($("#gh-file").value || "").trim() || "experience-data.json";
      repo.branch = ($("#gh-branch").value || "").trim() || "main";
      saveDB(); setGhStatus(tr("配置已保存到本机。点「推送到 GitHub」上传数据，或点「拉取」合并云端数据。"));
      toast(tr("GitHub 配置已保存"), "ok");
      break;
    }
    case "gh-push": {
      const repo = db.meta.repo;
      if (!repo.owner || !repo.repo) { toast(tr("请先填写 GitHub 用户名和仓库名"), "err"); break; }
      setGhStatus(tr("正在连接 GitHub 并推送数据…"));
      try {
        await ghPush(repo.owner, repo.repo, repo.file, exportJSON(true), repo.token, repo.branch);
        setGhStatus(trf("推送成功：已把 {0} 条经验写入 {1} 的 {2}\n现在别人打开页面后点「从 GitHub 拉取并合并」即可同步（公开仓库无需 Token）。", db.experiences.length, repo.owner + "/" + repo.repo, repo.file));
        toast(tr("已推送到 GitHub"), "ok");
      } catch (err) {
        setGhStatus(tr("推送失败：") + err.message);
        toast(tr("推送失败，详见状态栏"), "err");
      }
      break;
    }
    case "gh-pull": {
      const repo = db.meta.repo;
      if (!repo.owner || !repo.repo) { toast(tr("请先填写 GitHub 用户名和仓库名"), "err"); break; }
      setGhStatus(tr("正在从 GitHub 拉取数据…"));
      try {
        const data = await ghPull(repo.owner, repo.repo, repo.file, repo.token, repo.branch);
        if (await askConfirm(trf("云端有 {0} 条经验。合并规则：相同 ID 以云端为准，本地独有保留。继续？", data.experiences.length), tr("合并"))) {
          const byId = new Map(db.experiences.map(x => [x.id, x]));
          data.experiences.forEach(x => { if (x && x.id) byId.set(x.id, x); });
          db.experiences = [...byId.values()];
          if (data.tax && typeof data.tax === "object") for (const k of Object.keys(data.tax)) if (!(k in db.tax)) db.tax[k] = data.tax[k];
          saveDB();
          setGhStatus(trf("拉取成功：本地现有 {0} 条经验（云端 {1} 条已合并）。", db.experiences.length, data.experiences.length));
          toast(tr("已合并云端数据"), "ok");
          route();
        } else setGhStatus(tr("已取消合并。"));
      } catch (err) {
        setGhStatus(tr("拉取失败：") + err.message + "\n" + tr("提示：公开仓库无需 Token；私有仓库需在 Token 填个人访问令牌。"));
        toast(tr("拉取失败，详见状态栏"), "err");
      }
      break;
    }
    case "cancel": location.hash = "#/"; break;
    default: break;
  }
}
function onChange(e) {
  if (e.target.matches && e.target.matches('#path-pick select[data-level]')) {
    const lv = +e.target.dataset.level;
    const v = e.target.value;
    state.formPath = state.formPath.slice(0, lv);
    if (v) state.formPath[lv] = v;
    const holder = e.target.closest(".f-group");
    if (!holder) return;
    const oldPick = holder.querySelector("#path-pick");
    const oldAdd = holder.querySelector(".addsub");
    const tmp = document.createElement("div");
    tmp.innerHTML = renderPathPicks(state.formPath);
    if (oldPick) oldPick.replaceWith(tmp.querySelector(".path-pick"));
    if (oldAdd) oldAdd.replaceWith(tmp.querySelector(".addsub"));
    return;
  }
  if (e.target && e.target.id === "import-file") {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    handleImport(f);
    e.target.value = "";
  }
}
async function handleImport(file) {
  let text;
  try { text = await file.text(); } catch (err) { toast(tr("读取文件失败"), "err"); return; }
  let data;
  try { data = JSON.parse(text); } catch (err) { toast(tr("文件不是有效的 JSON"), "err"); return; }
  if (!data || !Array.isArray(data.experiences)) { toast(tr("数据格式不正确：缺少 experiences 字段"), "err"); return; }
  if (!await askConfirm(trf("将合并 {0} 条经验到本地：\n· 相同 ID 以导入文件为准\n· 本地独有的保留\n· 学科目录自动补充。\n继续？", data.experiences.length), tr("合并导入"))) return;
  const byId = new Map(db.experiences.map(x => [x.id, x]));
  data.experiences.forEach(x => { if (x && x.id) byId.set(x.id, x); });
  db.experiences = [...byId.values()];
  if (data.tax && typeof data.tax === "object") for (const k of Object.keys(data.tax)) if (!(k in db.tax)) db.tax[k] = data.tax[k];
  saveDB(); toast(trf("导入成功，共 {0} 条经验", db.experiences.length), "ok"); route();
}

/* ============ 投稿中心 ============ */
function renderContrib() {
  const deeps = db.experiences.filter(e => e.kind === "deep" && !e.sample).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  const total = db.experiences.filter(e => !e.sample).length;
  const now = Date.now();
  const week = db.experiences.filter(e => !e.sample && (now - (e.createdAt || 0)) < 7 * 864e5).length;
  const allLikes = db.experiences.filter(e => !e.sample).reduce((s, e) => s + (e.likes || 0), 0);
  const avg = total ? Math.round(allLikes / total * 10) / 10 : 0;
  const guidelines = [
    tr("真实经历过，不是道听途说"),
    tr("有可执行的步骤或方法，不只有观点"),
    tr("标注难度与耗时，让后来者有预期"),
    tr("附上资源与避坑，减少试错成本")
  ];
  $("#app").innerHTML = `
  <div style="max-width:960px;margin:0 auto;padding:26px 16px 60px">
    <h1 class="page-title">${tr("投稿中心")}</h1>
    <p style="color:var(--ink2);font-size:14px;margin:4px 0 22px">${tr("投稿指南")}</p>
    <div class="stats" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:24px">
      <div class="stat"><b>${total}</b><span>${tr("总投稿数")}</span></div>
      <div class="stat"><b>${week}</b><span>${tr("本周新增")}</span></div>
      <div class="stat"><b>${avg}</b><span>${tr("平均点赞")}</span></div>
    </div>
    <div class="set-card">
      <h2>${tr("投稿指南")}</h2>
      <ul class="pit-list" style="margin-top:10px">
        ${guidelines.map(g => `<li>${IC.check}<span>${esc(g)}</span></li>`).join("")}
      </ul>
      <div class="set-btns" style="margin-top:16px">
        <button class="btn primary" data-action="go-submit">${tr("我要投稿")}</button>
      </div>
    </div>
    <div class="set-card" style="margin-top:16px">
      <h2>${trf("深度经验投稿库（{0}）", deeps.length)}</h2>
      ${deeps.length ? `<div class="cards" style="padding:8px 0 0">${deeps.map(renderCard).join("")}</div>` : `<div class="empty" style="padding:30px"><b>${tr("还没有投稿")}</b>${tr("成为第一个投稿的人吧。")}<button class="btn primary" style="margin-top:12px" data-action="go-submit">${tr("我要投稿")}</button></div>`}
    </div>
  </div>`;
}

/* ============ 启动 ============ */
function init() {
  loadDB();
  window.addEventListener("hashchange", route);
  document.addEventListener("click", onClick);
  document.addEventListener("change", onChange);
  $("#btn-submit").addEventListener("click", () => { location.hash = "#/submit"; });
  $("#lang-btn").addEventListener("click", () => { setLang(lang === "en" ? "zh" : "en"); route(); toast(lang === "en" ? "Switched to English" : "已切换为中文", "ok"); });
  $("#top-q").addEventListener("keydown", e => { if (e.key === "Enter") { state.filter.q = e.target.value; location.hash = "#/"; route(); } });
  route();
}
init();
</script>
</body>
</html>
